<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>جت‌سئو نیوز</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="top">
    <img src="icons/icon-32.png" alt="" width="22" height="22" />
    <strong>جت‌سئو نیوز</strong>
    <span id="who" class="muted"></span>
    <div id="view" class="seg" role="group" aria-label="حالت نمایش">
      <button type="button" data-view="tab">صفحه کامل</button>
      <button type="button" data-view="panel">پنل کناری</button>
    </div>
    <!-- shown by panel.js (setExport) while the list on screen has rows to save -->
    <button id="export" class="icon" type="button" title="خروجی این فهرست به صورت فایل (CSV، قابل باز کردن در اکسل)" aria-label="اکسل: خروجی فایل از این فهرست" hidden>⬇ اکسل</button>
    <button id="refresh" class="icon" type="button" title="به‌روزرسانی" aria-label="به‌روزرسانی">⟳</button>
    <button id="settings" class="icon" type="button" title="تنظیمات" aria-label="تنظیمات" hidden>⚙</button>
  </header>
  <div id="banner" hidden></div>
  <div id="whatsnew" hidden></div>
  <!-- the four sections; panel.js fills both rows from what the account may open (renderNav) -->
  <nav id="tabs" class="tabs" hidden aria-label="بخش‌ها"></nav>
  <nav id="subtabs" class="tabs sub" hidden aria-label="فهرست‌های این بخش"></nav>
  <!-- «فقط کلیدواژه‌های من» is on: which words the lists are kept to, and the way back (panel.js renderFocus) -->
  <div id="focus" hidden></div>
  <!-- the stories of the notification that was clicked (panel.js showTold) -->
  <div id="told" role="region" aria-label="سوژه‌های اعلان" hidden></div>
  <main id="main" aria-live="polite"></main>
  <script src="api.js"></script>
  <script src="panel.js"></script>
</body>
</html>
